services:
  minecraft:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: minecraft-server
    ports:
      - "25565:25565"
    environment:
      MEMORY: 2G
      PAPER_VERSION: "26.3"
    volumes:
      - ./server:/server
    stdin_open: true
    tty: true
    restart: unless-stopped
    stop_grace_period: 45s
