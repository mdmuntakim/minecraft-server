# PaperMC server settings.
# Start with: ./scripts/start.sh
# The world, logs, caches and the downloaded paper.jar are runtime output and
# are not part of the source tree (.gitignore).
server-port=25565
server-ip=
max-players=20
online-mode=true
enforce-secure-profile=true
white-list=false
motd=PaperMC 26.3 \u00a77| \u00a7aMinecraft Server
difficulty=normal
gamemode=survival
force-gamemode=false
pvp=true
allow-flight=false
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
generate-structures=true
level-name=world
level-type=minecraft:normal
level-seed=
view-distance=8
simulation-distance=6
spawn-protection=0
enable-status=true
enable-query=false
enable-rcon=false
rcon.port=25575
rcon.password=
broadcast-rcon-to-ops=true
enable-command-block=false
network-compression-threshold=256
max-tick-time=60000
sync-chunk-writes=true
prevent-proxy-connections=false
