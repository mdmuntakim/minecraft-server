name: server

# Start a public PaperMC server from the Actions tab:
# Actions -> server -> Run workflow.  The game address is printed in the job
# summary and in the logs as soon as the tunnel is up.
#
# A run may be longer than six hours: the script stops each job before the
# GitHub limit, saves the world as an artifact and dispatches the next session
# with previous_run set.  The next job restores the world and reopens the same
# bore.pub port, so a 360 minute request is two sessions of 320 + 40 minutes.
on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Total minutes online, 1-1440 (over 330 is split into sessions)'
        required: true
        default: '360'
      public_port:
        description: 'Fixed bore.pub port, e.g. 25565 (empty = random)'
        required: false
        default: '25565'
      fallback_port:
        description: 'Second fixed bore.pub port when public_port is taken'
        required: false
        default: '25999'
      memory:
        description: 'Java heap for the server'
        required: true
        default: '2G'
      paper_version:
        description: 'Paper version'
        required: true
        default: '26.3'
      mobhead:
        description: 'Install the latest MobHead release'
        type: boolean
        default: true
      online_mode:
        description: 'Require a Minecraft account (online-mode)'
        type: boolean
        default: true
      save_world:
        description: 'Upload the world as a run artifact'
        type: boolean
        default: true
      session_minutes:
        description: 'Longest single job (internal, 1-330)'
        required: true
        default: '320'
      elapsed_minutes:
        description: 'Minutes already served (internal, set by the previous session)'
        required: true
        default: '0'
      previous_run:
        description: 'Run id whose world artifact is restored (internal, set by the previous session)'
        required: false
        default: ''

run-name: Minecraft server (${{ inputs.duration_minutes }} min)

permissions:
  contents: read
  # The last session of a long run dispatches the next one.
  actions: write

# One public server per repository; a second run waits instead of stealing
# the port and the world.  A continuation session is queued behind the running
# one and starts as soon as the world artifact is uploaded.
concurrency:
  group: minecraft-server
  cancel-in-progress: false

jobs:
  server:
    runs-on: ubuntu-latest
    # GitHub cancels a job at 6 hours.  A session stops earlier (320 minutes
    # by default) so the world save and the artifact upload still finish.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore the world from the previous session
        if: inputs.previous_run != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/restore-world.sh "${{ inputs.previous_run }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache the tunnel client
        uses: actions/cache@v4
        with:
          path: .cache
          key: minecraft-${{ runner.os }}-${{ inputs.paper_version }}-v1
          restore-keys: minecraft-${{ runner.os }}-

      - name: Run the public server
        env:
          DURATION_MINUTES: ${{ inputs.duration_minutes }}
          ELAPSED_MINUTES: ${{ inputs.elapsed_minutes }}
          SESSION_MINUTES: ${{ inputs.session_minutes }}
          PUBLIC_PORT: ${{ inputs.public_port }}
          PUBLIC_PORT_FALLBACK: ${{ inputs.fallback_port }}
          MEMORY: ${{ inputs.memory }}
          PAPER_VERSION: ${{ inputs.paper_version }}
          MOBHEAD: ${{ inputs.mobhead && '1' || '0' }}
          ONLINE_MODE: ${{ inputs.online_mode && 'true' || 'false' }}
          SAVE_WORLD: ${{ inputs.save_world && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/run-server.sh

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-logs-${{ github.run_number }}
          path: |
            run/
            server/logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the world
        if: always() && inputs.save_world
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-world-${{ github.run_number }}
          path: |
            server/world/
            server/world_nether/
            server/world_the_end/
          if-no-files-found: warn
          retention-days: 7
