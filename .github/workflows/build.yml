name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: End-to-end server test
        run: ./scripts/test-server.sh
        env:
          MEMORY: 1G

      - name: Build release bundle
        run: ./scripts/build-dist.sh

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-server-26.3
          path: |
            dist/minecraft-server-26.3.tar.gz
            dist/minecraft-server-26.3.tar.gz.sha256
          if-no-files-found: error
